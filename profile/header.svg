<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Vitor Martins — Full-Stack Developer</title>
  <desc id="desc">Professional profile banner with a dark blue gradient and abstract technology-inspired geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#14294b"/>
      <stop offset="100%" stop-color="#123c5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#94a3b8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="125" r="170" fill="#38bdf8" opacity=".07"/>
  <circle cx="1050" cy="125" r="118" fill="none" stroke="#7dd3fc" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="1050" cy="125" r="76" fill="none" stroke="#7dd3fc" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M880 190 L1000 70 L1080 150 L1160 70" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <circle cx="1000" cy="70" r="5" fill="#60a5fa"/>
  <circle cx="1080" cy="150" r="5" fill="#2dd4bf"/>
  <rect x="76" y="65" width="5" height="128" rx="2.5" fill="url(#accent)"/>
  <text x="108" y="116" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.4">Vitor Martins</text>
  <text x="110" y="158" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3.2">FULL-STACK DEVELOPER</text>
  <text x="110" y="197" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Web applications  ·  Backend services  ·  APIs &amp; integrations</text>
</svg>